<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abi & Sami TikTok Preview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h2 {
            margin-bottom: 20px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* Container mimicking a mobile phone screen */
        .phone-mockup {
            width: 360px;
            height: 640px;
            background-color: #000000;
            border: 8px solid #333333;
            border-radius: 36px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* Fullscreen video layout inside the phone */
        .tiktok-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Overlay text mimicking TikTok captions */
        .video-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            pointer-events: none;
        }

        .username {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .caption {
            font-size: 14px;
            line-height: 1.4;
            color: #e5e5e5;
        }

        .hashtags {
            color: #2af5ff;
            font-weight: bold;
        }

        /* Simple button controls at the bottom of the page */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #fe2c55; /* TikTok Red */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #e02447;
        }
    </style>
</head>
<body>

    <h2>TikTok Clip Preview</h2>

    <div class="phone-mockup">
        <!-- Video element playing the clip -->
        <video id="videoPlayer" class="tiktok-video" autoplay loop muted playsinline>
            <source id="videoSource" src="https://assets.mixkit.co/videos/preview/mixkit-man-holding-a-clock-over-his-face-41712-large.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- UI overlay details -->
        <div class="video-overlay">
            <div class="username">@WaleAnimations</div>
            <div class="caption" id="videoCaption">Sami is ALWAYS late... 🙄 Waiting at the cafe simulation.</div>
            <div class="hashtags">#3DAnimation #PixarStyle #AbiAndSami</div>
        </div>
    </div>

    <!-- Controls to step through your script scenes -->
    <div class="controls">
        <button class="btn" onclick="playClip(1)">Clip 1: Abi Waits</button>
        <button class="btn" onclick="playClip(2)">Clip 2: Sami Arrives</button>
        <button class="btn" onclick="playClip(3)">Clip 3: Outro</button>
    </div>

    <script>
        // Simple script to switch clips and captions dynamically
        function playClip(clipNumber) {
            const player = document.getElementById('videoPlayer');
            const source = document.getElementById('videoSource');
            const caption = document.getElementById('videoCaption');

            if (clipNumber === 1) {
                source.src = "https://assets.mixkit.co/videos/preview/mixkit-man-holding-a-clock-over-his-face-41712-large.mp4";
                caption.innerText = "Sami is ALWAYS late... 🙄 Waiting at the cafe simulation.";
            } else if (clipNumber === 2) {
                source.src = "https://assets.mixkit.co/videos/preview/mixkit-man-running-in-the-city-40058-large.mp4";
                caption.innerText = "He finally running in with a crazy excuse! 🏃‍♂️💨";
            } else if (clipNumber === 3) {
                source.src = "https://assets.mixkit.co/videos/preview/mixkit-friends-laughing-together-41648-large.mp4";
                caption.innerText = "Drop a follow if you have a friend like Sami! 👇";
            }

            // Reload and play the new video asset smoothly
            player.load();
            player.play();
        }
    </script>

</body>
</html>
